name: Analyze patterns (Gemini)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Only include articles with this tag (optional)"
        required: false
      site:
        description: "Only include articles from this site id, e.g. downtoearth (optional)"
        required: false
      since:
        description: "Only include articles published on/after this date, e.g. 2024-01-01 (optional)"
        required: false
      limit:
        description: "Max number of articles to include"
        required: false
        default: "300"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci --no-audit --no-fund

      - name: Run pattern analysis
        working-directory: scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.tag }}" ]; then ARGS="$ARGS --tag=${{ inputs.tag }}"; fi
          if [ -n "${{ inputs.site }}" ]; then ARGS="$ARGS --site=${{ inputs.site }}"; fi
          if [ -n "${{ inputs.since }}" ]; then ARGS="$ARGS --since=${{ inputs.since }}"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit=${{ inputs.limit }}"; fi
          npm run analyze -- $ARGS

      - name: Commit report
        run: |
          git config user.name "blog-archiver-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report produced."
          else
            git commit -m "chore: pattern analysis report $(date -u +'%Y-%m-%d')"
            git push
          fi
