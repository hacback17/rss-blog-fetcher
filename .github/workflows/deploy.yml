name: Deploy site (reusable)

on:
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Assemble site
        run: |
          mkdir -p _site/data _site/reports
          cp -r web/* _site/
          cp data/blogs.db _site/data/blogs.db
          cp scraper/config/sites.json _site/data/sites.json
          if [ -d reports ]; then cp -r reports/* _site/reports/; fi
          if [ ! -f _site/reports/index.json ]; then echo "[]" > _site/reports/index.json; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
