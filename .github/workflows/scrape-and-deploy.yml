name: Scrape blogs and deploy archive

on:
  schedule:
    # 03:00 UTC = 08:30 IST — runs once a day automatically.
    - cron: "0 3 * * *"
  workflow_dispatch: {} # the manual "Run workflow" button for on-demand runs

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Every database writer uses this group so two runs cannot download the
  # same snapshot and then overwrite each other's changes.
  group: "archive-database"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      db_changed: ${{ steps.persist.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download latest archive database
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download-archive-db.sh

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci --no-audit --no-fund

      - name: Run scraper
        working-directory: scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run run

      - name: Persist updated database
        id: persist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          updated_sha="$(sha256sum data/blogs.db | cut -d' ' -f1)"
          if [ "$updated_sha" = "$ARCHIVE_DB_SHA256" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No database changes to upload."
          else
            scripts/upload-archive-db.sh
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: scrape
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
