name: Remove a source (from issue)

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "archive-database"
  cancel-in-progress: false

jobs:
  remove-site:
    # Restricted to repo owner/collaborators — this can permanently delete
    # data (if "delete articles" is chosen) and always commits to the repo.
    if: >
      contains(github.event.issue.labels.*.name, 'remove-site') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci --no-audit --no-fund

      - name: Download latest archive database
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download-archive-db.sh

      - name: Parse issue and remove site
        id: remove
        working-directory: scraper
        env:
          # Indirected through an env var so arbitrary issue-body content
          # can't inject into the shell command.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: echo "$ISSUE_BODY" | node --experimental-sqlite src/remove-site-from-issue.js

      - name: Commit configuration and persist database
        env:
          SITE_NAME: ${{ steps.remove.outputs.site_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "blog-archiver-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scraper/config/sites.json
          git commit -m "chore: remove source $SITE_NAME (#$ISSUE_NUMBER)"
          git push
          updated_sha="$(sha256sum data/blogs.db | cut -d' ' -f1)"
          if [ "$updated_sha" != "$ARCHIVE_DB_SHA256" ]; then
            scripts/upload-archive-db.sh
          fi

      - name: Comment and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_NAME: ${{ steps.remove.outputs.site_name }}
          DELETED_COUNT: ${{ steps.remove.outputs.deleted_count }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Removed **$SITE_NAME** from \`scraper/config/sites.json\`. $([ "$DELETED_COUNT" != "0" ] && echo "Deleted $DELETED_COUNT already-scraped article(s) from this source." || echo "Already-scraped articles from this source were kept.")

          It will no longer be scraped going forward. The live site will update in a few minutes once Pages redeploys."
          gh issue close "$ISSUE_NUMBER"

  deploy:
    needs: remove-site
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
